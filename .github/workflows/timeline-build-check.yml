name: Timeline build check

on:
  push:
    branches:
      - timeline-rework

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: dotnet build Slice.csproj -c Release -p:Platform=x64
