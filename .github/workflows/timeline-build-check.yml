name: Timeline build check

on:
  push:
    branches:
      - timeline-rework

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SDK info
        shell: pwsh
        run: dotnet --info

      - name: Build
        shell: pwsh
        run: dotnet build Slice.csproj -c Release -p:Platform=x64
